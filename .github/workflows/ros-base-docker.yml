# CI for unh_marine_autonomy. The same file is carried on the rolling and
# jazzy branches (jazzy takes rolling's copy whole when a port is
# backported); pushes and pull requests to either run it.
#
# Job "jazzy" (always runs) imports the underlay and core layers from the
# .repos files of the branch it runs on, with this checkout in place of the
# unh_marine_autonomy entry, then builds and tests this repository's packages
# on Jazzy, mission_manager, the integration tests and bathymetry_layer among
# them (Nav2 is released for Jazzy, so rosdep installs it from apt).
#
# Job "rolling" builds and tests every package of this repository that needs
# no Nav2 (#418, #419), that is all but bathymetry_layer (ported, but Nav2 has
# no Rolling release, so it is checked on Rolling by hand against a
# source-built navigation2; see .agents/README.md). It reads no .repos file:
# its workspace is this checkout plus marine_ais (for marine_ais_msgs, which
# marine_web_view needs), unh_marine_navigation (for marine_nav_interfaces,
# marine_nav_utilities and marine_nav_tasks, which mission_manager,
# mission_manager_interfaces and the integration tests need) and geodesy from
# a pinned geographic_info clone (for marine_sidescan_mosaic and
# marine_survey_index). rosdep, the build and the test are given only the
# packages it builds (a package selector), so they never see navigation2,
# bathymetry_layer or the Nav2 packages of unh_marine_navigation, which are
# on disk but outside the closure. The job is skipped for pull requests to
# and pushes on jazzy (github.base_ref is the target branch of a pull
# request; github.ref_name is the pushed branch), so on the jazzy branch this
# file runs the jazzy job only.

name: docker-ros-core

on:
  push:
    branches: [ jazzy, rolling ]
  pull_request:
    branches: [ jazzy, rolling ]

jobs:
  jazzy:
    name: build-and-test (jazzy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ros:jazzy-ros-core

    steps:
    - name: Update apt
      run: apt update
    - name: Install ros dev tools
      run: DEBIAN_FRONTEND=noninteractive apt -y install ros-dev-tools
    - name: Checkout Project11
      uses: actions/checkout@v3
    - name: Init rosdep
      run: rosdep init
    - name: Update rosdep
      run: rosdep update
    - name: Create workspace
      run: mkdir -p ../jazzy_ws/src
    - name: Install repos
      run: |
        vcs import --input config/repos/underlay.repos ../jazzy_ws/src/
        vcs import --input config/repos/core.repos ../jazzy_ws/src/
    - name: Replace checked-out unh_marine_autonomy with PR branch
      run: |
        rm -rf ../jazzy_ws/src/unh_marine_autonomy
        ln -s $GITHUB_WORKSPACE ../jazzy_ws/src/unh_marine_autonomy
    # rosdep is given only the paths of what the build step builds (its
    # --packages-up-to closure), not every imported repository, so a new key
    # in a repository the job never builds cannot fail it. No -r: a key that
    # does not install fails the job. The list is checked to be non-empty so
    # a failed colcon list cannot leave rosdep with no paths.
    - name: Install ROS dependencies
      working-directory: ../jazzy_ws/
      shell: bash
      run: |
        set -euo pipefail
        paths="$(colcon list --base-paths src --paths-only --packages-up-to helm_manager command_bridge mission_manager joy_to_helm marine_autonomy marine_autonomy_integration_tests marine_contacts marine_web_view marine_vertical_datum marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic marine_bathymetry_store marine_mbes_backscatter_store marine_survey_index bathymetry_layer)"
        if [ -z "$paths" ]; then
          echo "colcon list returned no package paths" >&2
          exit 1
        fi
        echo "$paths"
        # shellcheck disable=SC2086
        DEBIAN_FRONTEND=noninteractive rosdep install --ignore-src -y --from-paths $paths
    - name: Colcon build
      working-directory: ../jazzy_ws/
      run: bash -c 'source /opt/ros/jazzy/setup.bash && colcon build --packages-up-to helm_manager command_bridge mission_manager joy_to_helm marine_autonomy marine_autonomy_integration_tests marine_contacts marine_web_view marine_vertical_datum marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic marine_bathymetry_store marine_mbes_backscatter_store marine_survey_index bathymetry_layer'
    - name: Colcon test
      working-directory: ../jazzy_ws/
      run: bash -c 'source /opt/ros/jazzy/setup.bash && colcon test --packages-select marine_interfaces marine_autonomy helm_manager joy_to_helm command_bridge mission_manager mission_manager_interfaces marine_autonomy_integration_tests marine_contacts marine_web_view marine_vertical_datum marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic marine_bathymetry_store marine_mbes_backscatter_store marine_survey_index bathymetry_layer --event-handlers console_direct+ --return-code-on-test-failure'
    - name: Test results
      working-directory: ../jazzy_ws/
      run: bash -c 'source /opt/ros/jazzy/setup.bash && colcon test-result --verbose'
      if: always()

  rolling:
    name: build-and-test (rolling)
    if: (github.base_ref || github.ref_name) != 'jazzy'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ros:rolling-ros-core

    steps:
    - name: Update apt
      run: apt-get update
    - name: Install ros dev tools
      run: DEBIAN_FRONTEND=noninteractive apt-get -y install ros-dev-tools git
    - name: Checkout
      uses: actions/checkout@v6
    - name: Init rosdep
      run: |
        if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
          rosdep init
        fi
    - name: Update rosdep
      run: rosdep update
    - name: Create workspace
      run: mkdir -p ../ws/src && ln -s "$GITHUB_WORKSPACE" ../ws/src/unh_marine_autonomy
    # marine_ais_msgs is not a rosdep key; it comes from source. This is the
    # rolling branch, not a pinned commit: accepted, as with the branches
    # config/repos/core.repos pins.
    - name: Clone marine_ais (rolling) for marine_ais_msgs
      working-directory: ../ws
      run: git clone --depth 1 -b rolling https://github.com/rolker/marine_ais.git src/marine_ais
    # marine_nav_interfaces, marine_nav_utilities and marine_nav_tasks are not
    # rosdep keys; they come from source. The rolling branch, not a pinned
    # commit, as with marine_ais. The clone also holds six Nav2 packages
    # (marine_nav_behavior_tree, marine_nav_behaviors,
    # marine_nav_bt_task_navigator, marine_nav_avoidance_controller,
    # marine_nav_crabbing_path_follower, marine_nav_ca_safety): they are on
    # disk but outside the package selector's closure below, so rosdep, the
    # build and the test never see them. If a package built here ever gained
    # a Nav2 dependency, the strict rosdep install would fail on it.
    - name: Clone unh_marine_navigation (rolling) for the marine_nav packages
      working-directory: ../ws
      run: git clone --depth 1 -b rolling https://github.com/rolker/unh_marine_navigation.git src/unh_marine_navigation
    # geodesy has no installable ros-rolling-geodesy apt package, Jazzy's
    # released 1.0.6 lacks geodesy/ecef.h, and the 1.0.7 tag does not compile;
    # f70b81a is that tag plus the <iomanip> fix (as in marine_ais's CI).
    # COLCON_IGNORE leaves only geodesy visible to colcon and rosdep, so the
    # released geographic_msgs is used. Drop this clone once a geographic_info
    # release newer than 1.0.7 reaches Rolling's apt. geodesy's own tests are
    # built, since the one build step's BUILD_TESTING covers every package in
    # it (marine_ais's CI avoids that with a separate geodesy build step; one
    # step is kept here for simplicity), but not run: the test step selects
    # only this repository's packages.
    - name: Clone geographic_info at f70b81a for geodesy
      working-directory: ../ws
      run: |
        git init src/geographic_info
        cd src/geographic_info
        git remote add origin https://github.com/ros-geographic-info/geographic_info.git
        git fetch --depth 1 origin f70b81a438172cd7a066dc1b18314d70e0eb6389
        git checkout FETCH_HEAD
    - name: Build only geodesy from the geographic_info clone
      working-directory: ../ws/src/geographic_info
      run: touch geographic_msgs/COLCON_IGNORE geographic_info/COLCON_IGNORE
    # Only the paths of the build step's --packages-up-to closure (this
    # repository's packages other than bathymetry_layer, plus marine_ais_msgs,
    # which marine_web_view depends on, marine_nav_interfaces,
    # marine_nav_utilities and marine_nav_tasks from unh_marine_navigation,
    # which mission_manager, mission_manager_interfaces and the integration
    # tests depend on, and geodesy, which marine_sidescan_mosaic and
    # marine_survey_index depend on), taken from colcon list as in the jazzy
    # job so the list cannot drift from the build step. rosdep then does not
    # ask for navigation2, nor for the keys of bathymetry_layer or of the Nav2
    # packages of unh_marine_navigation. No -r: a key that does not install
    # fails the job. The list is checked to be non-empty.
    - name: Install ROS dependencies
      working-directory: ../ws
      shell: bash
      run: |
        set -euo pipefail
        paths="$(colcon list --base-paths src --paths-only --packages-up-to marine_interfaces marine_vertical_datum command_bridge joy_to_helm marine_web_view marine_autonomy helm_manager marine_contacts marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic marine_bathymetry_store marine_mbes_backscatter_store marine_survey_index mission_manager_interfaces mission_manager marine_autonomy_integration_tests)"
        if [ -z "$paths" ]; then
          echo "colcon list returned no package paths" >&2
          exit 1
        fi
        echo "$paths"
        # shellcheck disable=SC2086
        DEBIAN_FRONTEND=noninteractive rosdep install --ignore-src -y --from-paths $paths
    - name: Colcon build
      working-directory: ../ws
      run: >
        bash -c 'source /opt/ros/rolling/setup.bash &&
        colcon build --packages-up-to
        marine_interfaces marine_vertical_datum command_bridge joy_to_helm
        marine_web_view marine_autonomy helm_manager marine_contacts
        marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic
        marine_bathymetry_store marine_mbes_backscatter_store
        marine_survey_index mission_manager_interfaces mission_manager
        marine_autonomy_integration_tests'
    # No install/setup.bash, as in the jazzy job: colcon test gives each
    # package the environment of its declared workspace dependencies only, so
    # a missing workspace test_depend fails here instead of being hidden by
    # the whole overlay. (A package from /opt/ros/rolling is on the path for
    # every package, declared or not.)
    - name: Colcon test
      working-directory: ../ws
      run: >
        bash -c 'source /opt/ros/rolling/setup.bash &&
        colcon test --packages-select
        marine_interfaces marine_vertical_datum command_bridge joy_to_helm
        marine_web_view marine_autonomy helm_manager marine_contacts
        marine_tiled_raster_store marine_backscatter marine_sidescan_mosaic
        marine_bathymetry_store marine_mbes_backscatter_store
        marine_survey_index mission_manager_interfaces mission_manager
        marine_autonomy_integration_tests
        --event-handlers console_direct+ --return-code-on-test-failure'
    - name: Test results
      working-directory: ../ws
      run: bash -c 'source /opt/ros/rolling/setup.bash && colcon test-result --verbose'
      if: always()
