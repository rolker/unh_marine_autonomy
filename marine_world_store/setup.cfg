[metadata]
name = marine_world_store
version = 0.0.0
description = World store (rev 3) layout, identity, fingerprints and STAC catalog
author = Roland Arsenault
author_email = roland.arsenault@unh.edu
license = BSD-3-Clause

[options]
packages = find:
# No python_requires: colcon's setup.py introspection literal_eval()s the
# parsed options, and a SpecifierSet is not a literal, so declaring it fails
# the colcon build outright.
# One dependency list, two consumers: these distribution names map 1:1 to the
# rosdep keys in package.xml's <exec_depend>s, and
# test/test_dependency_lists.py fails if the two ever drift apart.
# snakemake is pinned to 7: the Snakefile reads Snakemake 7's internal
# snakemake() frame to tell a real run from a dry run or a query
# (_executing()), and Snakemake 8 replaced that entry point. package.xml
# carries the same bounds (test_dependency_lists.py checks they agree).
install_requires =
    GDAL
    numpy
    PyYAML
    pystac
    snakemake>=7,<8

[options.packages.find]
exclude =
    test
    test.*

[options.entry_points]
console_scripts =
    mws_import_source = marine_world_store.cli.mws_import_source:console_main
    mws_write_revision = marine_world_store.cli.mws_write_revision:console_main
    mws_regenerate_catalog = marine_world_store.cli.mws_regenerate_catalog:console_main
    mws_link_depth_subset = marine_world_store.cli.mws_link_depth_subset:console_main
    mws_measure_sigma_fold = marine_world_store.cli.mws_measure_sigma_fold:console_main
    mws_refresh_fingerprints = marine_world_store.cli.mws_refresh_fingerprints:console_main
    mws_assemble_coverage = marine_world_store.cli.mws_assemble_coverage:console_main
    mws_list_tiles = marine_world_store.cli.mws_list_tiles:console_main

[develop]
script_dir=$base/lib/marine_world_store
[install]
install_scripts=$base/lib/marine_world_store

[tool:pytest]
testpaths = test
